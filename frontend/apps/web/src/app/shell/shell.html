<div class="layout">
  <header class="topbar">
    <a class="brand" routerLink="/">
      <i class="pi pi-sparkles" aria-hidden="true"></i>
      <span>AI Agent Platform</span>
    </a>
    <nav class="nav" aria-label="Điều hướng chính">
      @for (item of nav(); track item.link) {
      <a
        [routerLink]="item.link"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.link === '/' }"
      >
        <i [class]="item.icon" aria-hidden="true"></i>
        {{ item.label }}
      </a>
      }
    </nav>
    <div class="user">
      @if (session.me(); as me) {
      <span class="name">{{ session.displayName() }}</span>
      @for (role of me.roles; track role) {
      <p-tag [value]="role" severity="secondary" />
      } }
      <p-button
        icon="pi pi-sign-out"
        label="Đăng xuất"
        severity="secondary"
        [text]="true"
        (onClick)="logout()"
      />
    </div>
  </header>
  <main class="content">
    <router-outlet />
  </main>
</div>
