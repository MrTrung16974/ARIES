<div class="layout">
  <header class="topbar">
    <a class="brand" routerLink="/" aria-label="ARIES — trang chủ">
      <img src="assets/brand/aries-mark-64.png" alt="" width="32" height="32" />
      <span>ARIES</span>
    </a>
    <nav class="nav" aria-label="Điều hướng chính">
      @for (item of nav(); track item.link) {
      <a
        [routerLink]="item.link"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.link === '/' }"
      >
        <mat-icon class="sm" [svgIcon]="item.icon" aria-hidden="true" />
        {{ item.label }}
      </a>
      }
    </nav>
    @if (session.hasAnyRole('builder', 'admin')) {
    <button
      type="button"
      class="kbd"
      (click)="bar.toggle()"
      title="Command bar"
    >
      <mat-icon class="sm" svgIcon="bolt" aria-hidden="true" /> Ctrl K
    </button>
    }
    <div class="user">
      @if (session.me(); as me) {
      <span class="name">{{ session.displayName() }}</span>
      @for (role of me.roles; track role) {
      <ui-tag [value]="role" severity="secondary" />
      } }
      <button mat-button class="logout" type="button" (click)="logout()">
        <mat-icon svgIcon="logout" />
        Đăng xuất
      </button>
    </div>
  </header>
  <main class="content">
    <router-outlet />
  </main>
</div>
<app-command-bar #bar />
