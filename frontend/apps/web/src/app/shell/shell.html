<div class="layout">
  <header class="topbar">
    <a class="brand" routerLink="/" aria-label="ARIES — trang chủ">
      <img src="assets/brand/aries-mark-64.png" alt="" width="32" height="32" />
      <span>ARIES</span>
    </a>
    <nav class="nav" aria-label="Điều hướng chính">
      @for (item of nav(); track item.link) {
      <a
        [routerLink]="item.link"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.link === '/' }"
      >
        <i [class]="item.icon" aria-hidden="true"></i>
        {{ item.label }}
      </a>
      }
    </nav>
    @if (session.hasAnyRole('builder', 'admin')) {
    <button
      type="button"
      class="kbd"
      (click)="bar.toggle()"
      title="Command bar"
    >
      <i class="pi pi-bolt" aria-hidden="true"></i> Ctrl K
    </button>
    }
    <div class="user">
      @if (session.me(); as me) {
      <span class="name">{{ session.displayName() }}</span>
      @for (role of me.roles; track role) {
      <p-tag [value]="role" severity="secondary" />
      } }
      <p-button
        icon="pi pi-sign-out"
        label="Đăng xuất"
        severity="secondary"
        [text]="true"
        (onClick)="logout()"
      />
    </div>
  </header>
  <main class="content">
    <router-outlet />
  </main>
</div>
<app-command-bar #bar />
