# Header bảo mật dùng chung. Phải include trong MỌI location có add_header riêng,
# vì add_header ở location làm mất các add_header kế thừa từ server.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:8080; frame-src http://localhost:8080; frame-ancestors 'none'; base-uri 'self'; form-action 'self' http://localhost:8080; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
