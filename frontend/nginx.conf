server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  include /etc/nginx/aries-security-headers.conf;

  location = /assets/config.json {
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Bundle Angular có hash trong tên (main-XXXX.js, styles-XXXX.css) → cache vĩnh viễn an toàn.
  location ~* "-[A-Z0-9]{8,}\.(?:js|css)$" {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/aries-security-headers.conf;
  }

  # Ảnh, icon, font không có hash (favicon, logo...) → luôn kiểm tra ETag để nhận tài sản mới ngay khi build lại.
  location ~* \.(?:ico|png|svg|webp|woff2?)$ {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/aries-security-headers.conf;
  }

  # Trang chat công khai /c/<token> — được phép nhúng iframe (widget, ADR-0020).
  location ^~ /c/ {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/aries-security-headers-embed.conf;
    try_files /index.html =404;
  }

  # Script widget nhúng: website khác tải về — cache ngắn để cập nhật được.
  location = /embed.js {
    add_header Cache-Control "public, max-age=3600" always;
    include /etc/nginx/aries-security-headers.conf;
  }

  # index.html luôn kiểm tra lại để nhận bản build mới.
  location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/aries-security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
