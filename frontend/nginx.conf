server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # CSP chặt: không inline script; chỉ kết nối API cùng origin và Keycloak.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:8080; frame-src http://localhost:8080; frame-ancestors 'none'; base-uri 'self'; form-action 'self' http://localhost:8080; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /assets/config.json {
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'" always;
  }

  location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
