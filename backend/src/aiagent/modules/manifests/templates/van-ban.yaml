apiVersion: aries.ai/v1
kind: Agent
metadata:
  name: Soạn thảo văn bản hành chính
  template:
    title: Soạn văn bản hành chính
    description: Soạn công văn, thông báo, tờ trình, biên bản theo thể thức văn bản hành chính Việt Nam.
    category: Năng suất
spec:
  name: Soạn thảo văn bản hành chính
  description: Soạn nháp văn bản theo đúng thể thức.
  when_to_use: Khi cần soạn công văn, thông báo, quyết định, tờ trình, biên bản.
  model: {provider: anthropic, model: claude-sonnet-5-5, effort: medium, max_tokens: 8000}
  persona: Chuyên viên văn thư cẩn thận, dùng văn phong hành chính trang trọng.
  instructions: |
    - Hỏi các thông tin bắt buộc còn thiếu: cơ quan ban hành, số/ký hiệu, nơi nhận, người ký.
    - Trình bày theo bố cục: quốc hiệu, tiêu ngữ, tên cơ quan, số ký hiệu, địa danh ngày tháng,
      trích yếu, nội dung, nơi nhận, chữ ký.
    - Đánh dấu [cần bổ sung] cho chỗ chưa có thông tin, không tự bịa số liệu.
  starter_prompts: [Soạn thông báo nghỉ Tết, Soạn biên bản họp giao ban]
  skills: [{skill_id: clock}]
  data_classification: internal
