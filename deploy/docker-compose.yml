# Môi trường dev/staging on-prem. Xem docs/deployment.md.
# Chạy:  cd deploy && cp .env.example .env (đổi secret) && docker compose up -d --build
name: aiagent

x-backend-env: &backend-env
  AIAGENT_ENV: ${AIAGENT_ENV:-dev}
  AIAGENT_LOG_LEVEL: ${AIAGENT_LOG_LEVEL:-INFO}
  AIAGENT_DATABASE_URL: postgresql+asyncpg://aiagent_app:${AIAGENT_APP_DB_PASSWORD:?}@postgres:5432/aiagent
  AIAGENT_REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
  # iss trong token là URL mà trình duyệt thấy; JWKS lấy qua mạng nội bộ.
  AIAGENT_OIDC_ISSUER: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8080}/realms/aiagent
  AIAGENT_OIDC_JWKS_URL: http://keycloak:8080/realms/aiagent/protocol/openid-connect/certs
  AIAGENT_OIDC_AUDIENCE: aiagent-api
  AIAGENT_CORS_ORIGINS: '["http://localhost","http://localhost:4200"]'
  # LLM (ADR-0012). Để trống ANTHROPIC_API_KEY thì chỉ dùng được model giả "fake-echo".
  AIAGENT_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AIAGENT_LLM_FAKE_ENABLED: ${AIAGENT_LLM_FAKE_ENABLED:-true}
  # Provider tương thích OpenAI (có gói free). Bỏ trống key = tắt. *_MODELS: JSON list, [] = tự lấy.
  AIAGENT_GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  AIAGENT_GEMINI_MODELS: ${GEMINI_MODELS:-[]}
  AIAGENT_GROQ_API_KEY: ${GROQ_API_KEY:-}
  AIAGENT_GROQ_MODELS: ${GROQ_MODELS:-[]}
  AIAGENT_OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  AIAGENT_OPENROUTER_MODELS: ${OPENROUTER_MODELS:-[]}
  # Ollama tự host (profile "ollama"): http://ollama:11434. Bỏ trống = tắt.
  AIAGENT_OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
  AIAGENT_OLLAMA_MODELS: ${OLLAMA_MODELS_ALLOWED:-[]}
  AIAGENT_ARCHITECT_PROVIDER: ${ARCHITECT_PROVIDER:-anthropic}
  AIAGENT_ARCHITECT_MODEL: ${ARCHITECT_MODEL:-claude-opus-5-5}
  AIAGENT_ARCHITECT_FAST_MODEL: ${ARCHITECT_FAST_MODEL:-claude-haiku-5-5}
  AIAGENT_ARCHITECT_JUDGE_MODEL: ${ARCHITECT_JUDGE_MODEL:-claude-sonnet-5-5}
  # Kho bí mật cho secret của connection (ADR-0016). Dev: root token của OpenBao dev mode.
  AIAGENT_OPENBAO_ADDR: http://openbao:8200
  # API đăng nhập AppRole (file do openbao-init cấp) — không dùng root token (ADR-0018).
  AIAGENT_OPENBAO_ROLE_ID_FILE: /run/openbao/role_id
  AIAGENT_OPENBAO_SECRET_ID_FILE: /run/openbao/secret_id
  # Cấu hình không bí mật theo plugin.
  AIAGENT_PLUGIN_CONFIG: '{"web": {"searxng_url": "http://searxng:8080", "fetch_proxy": "http://squid:3129"}}'
  AIAGENT_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
  # OAuth cho connector (ADR-0018). Bỏ trống secret = tắt nhà cung cấp đó.
  AIAGENT_OAUTH_PROVIDERS: >-
    {"keycloak": {"name": "SSO nội bộ (Keycloak)",
    "authorize_url": "${PUBLIC_KEYCLOAK_URL:-http://localhost:8080}/realms/aiagent/protocol/openid-connect/auth",
    "token_url": "http://keycloak:8080/realms/aiagent/protocol/openid-connect/token",
    "userinfo_url": "http://keycloak:8080/realms/aiagent/protocol/openid-connect/userinfo",
    "client_id": "aries-connector", "client_secret": "${OAUTH_KEYCLOAK_CLIENT_SECRET:-}",
    "scopes": ["openid"]}}
  AIAGENT_OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
  AIAGENT_OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
  # Mọi lưu lượng ra Internet đi qua Squid (ADR-0018); dịch vụ nội bộ đi thẳng.
  HTTPS_PROXY: http://squid:3128
  HTTP_PROXY: http://squid:3128
  NO_PROXY: localhost,127.0.0.1,keycloak,openbao,postgres,redis,searxng,squid,traefik,web,mcp-demo,embedder,reranker,ollama,ollama-host
  # Kho tri thức (ADR-0019)
  AIAGENT_EMBEDDER_URL: http://embedder
  AIAGENT_RERANKER_URL: ${RERANKER_URL:-}  # đặt http://reranker khi bật profile rerank
  AIAGENT_KB_STORAGE_PATH: /data/kb

services:
  # ------------------------------------------------------------------ edge
  traefik:
    image: traefik:v3.7.19
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=aiagent_app
      - --entrypoints.web.address=:80
      - --accesslog=true
      - --api.dashboard=false
    ports:
      - "80:80"
    volumes:
      # Dev: socket read-only. Prod: dùng docker-socket-proxy hoặc file provider.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [app, edge]
    restart: unless-stopped

  # ------------------------------------------------------------------ data
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aiagent_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: aiagent
      AIAGENT_APP_DB_PASSWORD: ${AIAGENT_APP_DB_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiagent_owner -d aiagent"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    networks: [data]
    restart: unless-stopped

  openbao:
    image: openbao/openbao:2.7.2
    # Server mode, raft trên volume (ADR-0018). Khởi động lại sẽ ở trạng thái khóa → openbao-init mở.
    command: ["server", "-config=/openbao/config/aries.hcl"]
    volumes:
      - ./openbao/aries.hcl:/openbao/config/aries.hcl:ro
      - baodata:/openbao/file
    cap_add: [IPC_LOCK]
    networks: [data]
    restart: unless-stopped

  openbao-init:
    image: openbao/openbao:2.7.2
    # DEV/STAGING: tự init + unseal + cấp AppRole cho API. PROD: unseal thủ công/auto-unseal.
    entrypoint: ["sh", "/scripts/init.sh"]
    user: "0"  # ghi vào volume mới (root-owned); ở lại canh gác tự mở khóa (BAO_WATCH)
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_WATCH: "1"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/aries-ready"]
      interval: 3s
      timeout: 2s
      retries: 60
      start_period: 5s
    volumes:
      - ./openbao/init.sh:/scripts/init.sh:ro
      - baoinit:/init
      - baoapprole:/approle
    depends_on:
      openbao: { condition: service_started }
    networks: [data]
    restart: unless-stopped

  searxng:
    image: searxng/searxng:2026.9.20-fdd8525b1
    # Chỉ dùng nội bộ (không qua Traefik). Cần ra Internet để gọi các công cụ tìm kiếm.
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks: [app, edge]
    restart: unless-stopped

  squid:
    image: ubuntu/squid:6.6-24.04_beta
    # Egress proxy duy nhất cho API/worker (ADR-0018). :3128 allowlist, :3129 web.fetch.
    volumes:
      - ./squid/squid.conf:/etc/squid/squid.conf:ro
      - ./squid/allowed-domains.txt:/etc/squid/allowed-domains.txt:ro
    networks: [app, edge]
    restart: unless-stopped

  # ------------------------------------------------------------------ LLM tự host (tùy chọn)
  # Bật:  docker compose --profile ollama up -d ollama ollama-pull
  # rồi đặt OLLAMA_BASE_URL=http://ollama:11434 trong .env và restart api/worker.
  ollama:
    profiles: [ollama]
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    # GPU NVIDIA (cần nvidia-container-toolkit) — bỏ comment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    # edge: để pull model từ registry.ollama.ai; API/worker gọi qua mạng app (không qua Squid).
    networks: [app, edge]
    restart: unless-stopped

  # Dùng Ollama cài thẳng trên máy host (Windows/Mac, tận dụng GPU sẵn có) thay cho container trên.
  # ARIES: provider Ollama, base URL http://ollama-host:11434.
  #   docker compose --profile ollama-host up -d ollama-host
  ollama-host:
    profiles: [ollama-host]
    image: aiagent-backend:dev
    pull_policy: never  # dùng lại image backend (có Python), không tải gì thêm
    command: ["python", "/bridge/bridge.py"]
    environment:
      OLLAMA_UPSTREAM: ${OLLAMA_HOST_UPSTREAM:-http://host.docker.internal:11434}
    volumes:
      - ./ollama-bridge/bridge.py:/bridge/bridge.py:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [app, edge]
    restart: unless-stopped

  ollama-pull:
    profiles: [ollama]
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODELS_TO_PULL: ${OLLAMA_MODELS:-qwen3:8b}
    entrypoint: ["/bin/sh", "-c", "for m in $$OLLAMA_MODELS_TO_PULL; do echo \"pull $$m\"; ollama pull \"$$m\" || exit 1; done"]
    depends_on:
      ollama: { condition: service_healthy }
    networks: [app, edge]
    restart: "no"

  # ------------------------------------------------------------------ knowledge (ADR-0019)
  # TEI bản CPU, chỉ trong mạng nội bộ; tải model lần đầu qua egress proxy (allowlist HF).
  embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    # Batch nhỏ + 2 luồng: giới hạn RAM/CPU trên máy không GPU (ADR-0019).
    # --max-batch-tokens 2048 + --auto-truncate ⇒ max input length cũng = 2048 (chunk ~800 token).
    # Để 8192 thì warmup chạy chuỗi 8192 token → attention O(n²) vượt mem_limit → OOM-kill lặp.
    command: ["--model-id", "BAAI/bge-m3", "--port", "80", "--auto-truncate",
              "--max-client-batch-size", "16", "--max-batch-tokens", "2048",
              "--tokenization-workers", "2"]
    environment: &tei-env
      HUGGINGFACE_HUB_CACHE: /data
      HTTPS_PROXY: http://squid:3128
      HTTP_PROXY: http://squid:3128
      NO_PROXY: localhost,127.0.0.1
      OMP_NUM_THREADS: "2"
    volumes:
      - hfmodels:/data
    mem_limit: 5g
    cpus: 2
    depends_on:
      squid: { condition: service_started }
    networks: [app]
    # Không crash-loop vô hạn: OOM lặp lại làm Docker engine treo.
    restart: on-failure:3

  reranker:
    # Tùy chọn (tốn thêm ~3–4 GB RAM): docker compose --profile rerank up -d reranker
    # Không bật thì tìm kiếm vẫn chạy (vector + từ khóa + RRF), chỉ không có bước rerank.
    profiles: [rerank]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command: ["--model-id", "BAAI/bge-reranker-v2-m3", "--port", "80", "--auto-truncate",
              "--max-client-batch-size", "32", "--max-batch-tokens", "4096",
              "--tokenization-workers", "2"]
    environment: *tei-env
    mem_limit: 5g
    cpus: 2
    volumes:
      - hfmodels:/data
    depends_on:
      squid: { condition: service_started }
    networks: [app]
    restart: on-failure:3

  # ------------------------------------------------------------------ identity
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_HOSTNAME: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-aiagent.json:/opt/keycloak/data/import/realm-aiagent.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [app, data, edge]  # edge: cổng 8080 cho trình duyệt
    restart: unless-stopped

  # ------------------------------------------------------------------ backend
  migrate:
    build: { context: ../backend, target: runtime }
    image: aiagent-backend:dev
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-env
      AIAGENT_MIGRATOR_DATABASE_URL: postgresql+asyncpg://aiagent_owner:${POSTGRES_PASSWORD:?}@postgres:5432/aiagent
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]
    restart: "no"

  api:
    image: aiagent-backend:dev
    pull_policy: never  # image do service migrate build
    volumes:
      - baoapprole:/run/openbao:ro
      - kbfiles:/data/kb
    environment:
      <<: *backend-env
      FORWARDED_ALLOW_IPS: "*"  # api chỉ nhận traffic qua Traefik trong mạng nội bộ
    depends_on:
      migrate: { condition: service_completed_successfully }
      openbao-init: { condition: service_healthy }
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 10
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=PathPrefix(`/api`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.routers.api.priority=100
      - traefik.http.services.api.loadbalancer.server.port=8000
      - traefik.http.middlewares.api-ratelimit.ratelimit.average=50
      - traefik.http.middlewares.api-ratelimit.ratelimit.burst=100
      - traefik.http.routers.api.middlewares=api-ratelimit
    networks: [app, data]
    restart: unless-stopped

  worker:
    image: aiagent-backend:dev
    pull_policy: never
    volumes:
      - baoapprole:/run/openbao:ro
      - kbfiles:/data/kb
    command: ["aiagent-worker"]
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      openbao-init: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [data, app]
    restart: unless-stopped

  # ------------------------------------------------------------------ frontend
  web:
    build: { context: ../frontend }
    image: aiagent-web:dev
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.routers.web.priority=1
      - traefik.http.services.web.loadbalancer.server.port=8080
    networks: [app]
    restart: unless-stopped

  # ------------------------------------------------------------------ công cụ dev
  keycloak-setup:
    profiles: [demo]
    image: quay.io/keycloak/keycloak:26.0
    entrypoint: ["bash", "/setup/setup-connector-client.sh"]
    environment:
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-kcadmin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      OAUTH_KEYCLOAK_CLIENT_SECRET: ${OAUTH_KEYCLOAK_CLIENT_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
    volumes:
      - ./keycloak/setup-connector-client.sh:/setup/setup-connector-client.sh:ro
    depends_on:
      keycloak: { condition: service_healthy }
    networks: [app]
    restart: "no"

  mcp-demo:
    profiles: [demo]
    image: aiagent-backend:dev
    pull_policy: never
    # MCP server mẫu (streamable HTTP, yêu cầu header X-Api-Key) để thử MCP bridge.
    command: ["python", "-m", "aiagent_plugins.mcp_demo", "--http", "8765"]
    environment:
      DEMO_API_KEY: ${MCP_DEMO_API_KEY:-}
    networks: [app]
    restart: unless-stopped

  demo-seed:
    profiles: [demo]
    image: pgvector/pgvector:pg16
    entrypoint: ["bash", "/seed/seed-demo.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      DEMO_READER_PASSWORD: ${DEMO_READER_PASSWORD:-}
    volumes:
      - ./postgres/demo:/seed:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]
    restart: "no"

  backend-dev:
    profiles: [tools]
    build: { context: ../backend, target: dev }
    image: aiagent-backend:devtools
    working_dir: /app
    environment:
      <<: *backend-env
      AIAGENT_ENV: test
      AIAGENT_MIGRATOR_DATABASE_URL: postgresql+asyncpg://aiagent_owner:${POSTGRES_PASSWORD:?}@postgres:5432/aiagent
      AIAGENT_TEST_DATABASE_URL: postgresql+asyncpg://aiagent_app:${AIAGENT_APP_DB_PASSWORD:?}@postgres:5432/aiagent
    volumes:
      - ../backend/src:/app/src
      - ../backend/tests:/app/tests
      - ../backend/migrations:/app/migrations
      - baoapprole:/run/openbao:ro
    networks: [data]

networks:
  # app + data đều internal: API/worker chỉ ra Internet qua Squid.
  app:
    name: aiagent_app
    internal: true
  edge:
    name: aiagent_edge  # có Internet: traefik, keycloak (publish cổng), squid, searxng
  data:
    name: aiagent_data
    internal: true   # vùng dữ liệu không ra Internet
    # Lưu ý: mạng internal không publish được port ra host — dùng `docker compose exec`.

volumes:
  ollamadata:
  pgdata:
  redisdata:
  baodata:
  baoinit:
  baoapprole:
  hfmodels:
  kbfiles:
