# Môi trường dev/staging on-prem. Xem docs/deployment.md.
# Chạy:  cd deploy && cp .env.example .env (đổi secret) && docker compose up -d --build
name: aiagent

x-backend-env: &backend-env
  AIAGENT_ENV: ${AIAGENT_ENV:-dev}
  AIAGENT_LOG_LEVEL: ${AIAGENT_LOG_LEVEL:-INFO}
  AIAGENT_DATABASE_URL: postgresql+asyncpg://aiagent_app:${AIAGENT_APP_DB_PASSWORD:?}@postgres:5432/aiagent
  AIAGENT_REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
  # iss trong token là URL mà trình duyệt thấy; JWKS lấy qua mạng nội bộ.
  AIAGENT_OIDC_ISSUER: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8080}/realms/aiagent
  AIAGENT_OIDC_JWKS_URL: http://keycloak:8080/realms/aiagent/protocol/openid-connect/certs
  AIAGENT_OIDC_AUDIENCE: aiagent-api
  AIAGENT_CORS_ORIGINS: '["http://localhost","http://localhost:4200"]'
  # LLM (ADR-0012). Để trống ANTHROPIC_API_KEY thì chỉ dùng được model giả "fake-echo".
  AIAGENT_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AIAGENT_LLM_FAKE_ENABLED: ${AIAGENT_LLM_FAKE_ENABLED:-true}

services:
  # ------------------------------------------------------------------ edge
  traefik:
    image: traefik:v3.7.19
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=aiagent_app
      - --entrypoints.web.address=:80
      - --accesslog=true
      - --api.dashboard=false
    ports:
      - "80:80"
    volumes:
      # Dev: socket read-only. Prod: dùng docker-socket-proxy hoặc file provider.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [app]
    restart: unless-stopped

  # ------------------------------------------------------------------ data
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aiagent_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: aiagent
      AIAGENT_APP_DB_PASSWORD: ${AIAGENT_APP_DB_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiagent_owner -d aiagent"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    networks: [data]
    restart: unless-stopped

  openbao:
    image: openbao/openbao:2.7.2
    # Chế độ dev (in-memory, tự unseal). Prod: storage raft + Shamir unseal (docs/security.md mục 3).
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_DEV_ROOT_TOKEN:?}
    cap_add: [IPC_LOCK]
    networks: [data]
    restart: unless-stopped

  # ------------------------------------------------------------------ identity
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_HOSTNAME: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-aiagent.json:/opt/keycloak/data/import/realm-aiagent.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [app, data]
    restart: unless-stopped

  # ------------------------------------------------------------------ backend
  migrate:
    build: { context: ../backend, target: runtime }
    image: aiagent-backend:dev
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-env
      AIAGENT_MIGRATOR_DATABASE_URL: postgresql+asyncpg://aiagent_owner:${POSTGRES_PASSWORD:?}@postgres:5432/aiagent
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]
    restart: "no"

  api:
    image: aiagent-backend:dev
    pull_policy: never  # image do service migrate build
    environment:
      <<: *backend-env
      FORWARDED_ALLOW_IPS: "*"  # api chỉ nhận traffic qua Traefik trong mạng nội bộ
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 10
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=PathPrefix(`/api`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.routers.api.priority=100
      - traefik.http.services.api.loadbalancer.server.port=8000
      - traefik.http.middlewares.api-ratelimit.ratelimit.average=50
      - traefik.http.middlewares.api-ratelimit.ratelimit.burst=100
      - traefik.http.routers.api.middlewares=api-ratelimit
    networks: [app, data]
    restart: unless-stopped

  worker:
    image: aiagent-backend:dev
    pull_policy: never
    command: ["aiagent-worker"]
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [data, app]
    restart: unless-stopped

  # ------------------------------------------------------------------ frontend
  web:
    build: { context: ../frontend }
    image: aiagent-web:dev
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.routers.web.priority=1
      - traefik.http.services.web.loadbalancer.server.port=8080
    networks: [app]
    restart: unless-stopped

  # ------------------------------------------------------------------ công cụ dev
  backend-dev:
    profiles: [tools]
    build: { context: ../backend, target: dev }
    image: aiagent-backend:devtools
    working_dir: /app
    environment:
      <<: *backend-env
      AIAGENT_ENV: test
      AIAGENT_MIGRATOR_DATABASE_URL: postgresql+asyncpg://aiagent_owner:${POSTGRES_PASSWORD:?}@postgres:5432/aiagent
      AIAGENT_TEST_DATABASE_URL: postgresql+asyncpg://aiagent_app:${AIAGENT_APP_DB_PASSWORD:?}@postgres:5432/aiagent
    volumes:
      - ../backend/src:/app/src
      - ../backend/tests:/app/tests
      - ../backend/migrations:/app/migrations
    networks: [data]

networks:
  app:
    name: aiagent_app
  data:
    name: aiagent_data
    internal: true   # vùng dữ liệu không ra Internet
    # Lưu ý: mạng internal không publish được port ra host — dùng `docker compose exec`.

volumes:
  pgdata:
  redisdata:
