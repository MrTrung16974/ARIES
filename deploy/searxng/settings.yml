# SearXNG tự host cho skill web.search (ADR-0016). secret_key lấy từ biến SEARXNG_SECRET.
use_default_settings: true
general:
  instance_name: "ARIES Search"
  enable_metrics: false
search:
  safe_search: 1
  default_lang: "vi"
  formats:
    - html
    - json
server:
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"
